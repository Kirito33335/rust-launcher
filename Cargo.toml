[package]
name = "rust-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
directories = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
