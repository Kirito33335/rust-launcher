name: Build Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rust-launcher-windows
            file: target/release/rust-launcher.exe
          - os: ubuntu-latest
            artifact: rust-launcher-linux
            file: target/release/rust-launcher
          - os: macos-latest
            artifact: rust-launcher-macos
            file: target/release/rust-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Bauen
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
